# Phase 1 test rig: direct joint commands (only with test_actuators:=true, when r2_drive.py does not run).
- ros_topic_name: /test/back_left_joint/cmd_vel
  gz_topic_name: /model/r2/joint/back_left_joint/cmd_vel
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: ignition.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /test/back_right_joint/cmd_vel
  gz_topic_name: /model/r2/joint/back_right_joint/cmd_vel
