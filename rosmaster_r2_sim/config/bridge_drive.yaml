# Drive actuators (not used with test_actuators:=true): r2_drive.py's joint commands to Gazebo.
# /cmd_vel and /odom_raw are r2_drive.py's own ROS topics, not bridged.
- ros_topic_name: /r2_drive/back_left_joint/cmd_vel
  gz_topic_name: /model/r2/joint/back_left_joint/cmd_vel
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: ignition.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /r2_drive/back_right_joint/cmd_vel
  gz_topic_name: /model/r2/joint/back_right_joint/cmd_vel
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: ignition.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /r2_drive/front_left_steer_joint/cmd_pos
  gz_topic_name: /model/r2/joint/front_left_steer_joint/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: ignition.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /r2_drive/front_right_steer_joint/cmd_pos
  gz_topic_name: /model/r2/joint/front_right_steer_joint/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: ignition.msgs.Double
  direction: ROS_TO_GZ
