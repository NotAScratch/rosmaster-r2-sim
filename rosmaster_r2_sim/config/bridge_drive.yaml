# Ackermann drive (not used with test_actuators:=true).
# Matches the real robot: /cmd_vel in, wheel odometry out on /odom_raw (frame odom -> base_footprint).
- ros_topic_name: /cmd_vel
  gz_topic_name: /model/r2/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: ignition.msgs.Twist
  direction: ROS_TO_GZ

- ros_topic_name: /odom_raw
  gz_topic_name: /model/r2/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS
